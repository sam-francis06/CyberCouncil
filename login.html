<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Council</title>
    <link rel="icon" type="image/png" href="shield.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="nav">
      <div class="nav-content">
        <a href="/" class="nav-logo">
          <svg
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>Cyber Council</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
          <a href="team.html">Team</a>
        </div>
        <button class="hamburger" aria-label="Toggle menu">
          <svg
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          >
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>
      </div>
    </nav>
    <div class="login-section">
      <div class="form-container">
        <div class="login-header">
          <svg
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            class="login-icon"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <h2>Welcome Back</h2>
          <p class="login-subtitle">Sign in to access your account</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="Enter your email"
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="Enter your password"
              autocomplete="current-password"
            />
          </div>
          <div class="form-options">
            <div class="remember-me">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>
            <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
          </div>
          <button type="submit" class="login-button">Sign In</button>
        </form>
        <div id="status-msg"></div>
        <div class="signup-link">
          Don't have an account? <a href="signup.html">Create Account</a>
        </div>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Reset Password</h3>
        </div>
        <div class="modal-body">
          <p>
            Enter your email address and we'll send you a link to reset your
            password.
          </p>
          <div class="form-group">
            <input
              type="email"
              id="reset-email"
              placeholder="Your email address"
              required
            />
          </div>
        </div>
        <div class="modal-footer">
          <button id="cancel-reset" class="modal-button cancel-button">
            Cancel
          </button>
          <button id="submit-reset" class="modal-button submit-button">
            Send Reset Link
          </button>
        </div>
      </div>
    </div>

    <button class="theme-toggle" aria-label="Toggle theme">
      <svg
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabase = window.supabase.createClient(
        'https://arhsghqcdocpquqkzxwh.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyaHNnaHFjZG9jcHF1cWt6eHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1MDU4NTUsImV4cCI6MjA2MTA4MTg1NX0.J80PQNykHjA5zAtffWDx0TRjd98fIX0cP_bzHFa5CK8'
      );

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('login-form');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const statusMsg = document.getElementById('status-msg');
        const forgotPasswordLink = document.getElementById(
          'forgot-password-link'
        );
        const forgotPasswordModal = document.getElementById(
          'forgot-password-modal'
        );
        const resetEmailInput = document.getElementById('reset-email');
        const cancelResetBtn = document.getElementById('cancel-reset');
        const submitResetBtn = document.getElementById('submit-reset');

        if (!form || !email || !password || !statusMsg) {
          console.error('Missing login form elements.');
          return;
        }

        // Forgot password functionality
        if (forgotPasswordLink) {
          forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            resetEmailInput.value = email.value || ''; // Pre-fill with login email if available
            forgotPasswordModal.style.display = 'flex';
          });
        }

        // Close modal when cancel button is clicked
        if (cancelResetBtn) {
          cancelResetBtn.addEventListener('click', () => {
            forgotPasswordModal.style.display = 'none';
          });
        }

        // Handle password reset request
        if (submitResetBtn) {
          submitResetBtn.addEventListener('click', async () => {
            const resetEmail = resetEmailInput.value.trim();

            if (!resetEmail) {
              alert('Please enter your email address');
              return;
            }

            statusMsg.textContent = '⏳ Sending reset link...';
            statusMsg.className = 'status-message';
            forgotPasswordModal.style.display = 'none';

            try {
              const { error } = await supabase.auth.resetPasswordForEmail(
                resetEmail,
                {
                  redirectTo: window.location.origin + '/reset-password.html',
                }
              );

              if (error) throw error;

              statusMsg.textContent =
                '✅ Password reset link sent! Please check your email.';
              statusMsg.className = 'status-message success';
            } catch (error) {
              statusMsg.textContent = '❌ ' + error.message;
              statusMsg.className = 'status-message error';
            }
          });
        }

        // Close modal when clicking outside
        window.addEventListener('click', (event) => {
          if (event.target === forgotPasswordModal) {
            forgotPasswordModal.style.display = 'none';
          }
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          statusMsg.textContent = '⏳ Logging in...';
          statusMsg.className = 'status-message';

          try {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: email.value,
              password: password.value,
            });

            if (error) throw error;

            const fullName = data.user.user_metadata?.full_name || 'User';
            localStorage.setItem('fullname', fullName);
            localStorage.setItem('email', email.value);
            statusMsg.textContent = `✅ Welcome, ${fullName}!`;
            statusMsg.className = 'status-message success';

            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } catch (error) {
            statusMsg.textContent = '❌ ' + error.message;
            statusMsg.className = 'status-message error';
          }
        });
      });
    </script>
    <script>
      // Mobile menu toggle functionality
      document
        .querySelector('.hamburger')
        .addEventListener('click', function () {
          document.querySelector('.nav-links').classList.toggle('active');
        });

      // Close menu when clicking outside
      document.addEventListener('click', function (event) {
        const navLinks = document.querySelector('.nav-links');
        const hamburger = document.querySelector('.hamburger');

        if (
          !navLinks.contains(event.target) &&
          !hamburger.contains(event.target) &&
          navLinks.classList.contains('active')
        ) {
          navLinks.classList.remove('active');
        }
      });
    </script>
    <script>
      // Theme toggle functionality
      const themeToggle = document.querySelector('.theme-toggle');
      const html = document.documentElement;

      // Check for saved theme preference
      const savedTheme = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', savedTheme);

      // Update theme toggle icon
      const updateThemeIcon = (theme) => {
        const moonIcon =
          '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
        const sunIcon =
          '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        themeToggle.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
      };

      updateThemeIcon(savedTheme);

      // Toggle theme
      themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });
    </script>
    <!-- Add this at the end of the body -->
    <script src="login.js"></script>
  </body>
</html>
