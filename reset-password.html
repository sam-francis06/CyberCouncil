<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Council</title>
  <link rel="icon" type="image/png" href="shield.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css" />
  <style>
    body {
      background: #11111f;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .reset-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: linear-gradient(45deg, rgba(79,70,229,0.1), rgba(147,51,234,0.1));
    }
    .form-container {
      background: rgba(17,24,39,0.7);
      padding: 2.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(147,51,234,0.2);
      backdrop-filter: blur(12px);
    }
    h2 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 1.5rem;
      background: linear-gradient(to right, #9333ea, #4f46e5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(31,41,55,0.7);
      border: 1px solid rgba(147,51,234,0.2);
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #9333ea;
      box-shadow: 0 0 0 2px rgba(147,51,234,0.2);
    }
    button {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #9333ea, #4f46e5);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(147,51,234,0.3);
    }
    .status-message {
      margin-top: 1rem;
      text-align: center;
      padding: 0.75rem;
      border-radius: 0.5rem;
    }
    .error {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.2);
    }
    .success {
      background: rgba(34,197,94,0.1);
      color: #22c55e;
      border: 1px solid rgba(34,197,94,0.2);
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #9ca3af;
    }
    .login-link a {
      color: #9333ea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .login-link a:hover {
      color: #4f46e5;
    }
    .password-requirements {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(17, 17, 31, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(123, 97, 255, 0.2);
      z-index: 1000;
    }
    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: white;
      text-decoration: none;
    }
    .nav-logo svg {
      color: var(--purple-400);
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      color: #9ca3af;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--purple-400);
    }
    .hamburger {
      display: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0.5rem;
    }
    .hamburger svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }
      .nav-content {
        position: relative;
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        background: rgba(17, 17, 31, 0.95);
        padding: 1rem;
        border-radius: 0 0 1rem 1rem;
        border: 1px solid rgba(123, 97, 255, 0.2);
        border-top: none;
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links a {
        padding: 0.75rem 1rem;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-content container">
      <div class="nav-logo">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Cyber Council</span>
      </div>
      <button class="hamburger" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
  </nav>

  <div class="reset-section">
    <div class="form-container">
      <h2>Reset Password</h2>
      <form id="reset-form">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required />
          <div class="password-requirements">
            Password must be at least 8 characters long and include a mix of letters, numbers, and special characters.
          </div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required />
        </div>
        <button type="submit">Reset Password</button>
      </form>
      <div id="status-msg"></div>
      <div class="login-link">
        Remember your password? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://arhsghqcdocpquqkzxwh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyaHNnaHFjZG9jcHF1cWt6eHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1MDU4NTUsImV4cCI6MjA2MTA4MTg1NX0.J80PQNykHjA5zAtffWDx0TRjd98fIX0cP_bzHFa5CK8'
    );

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('reset-form');
      const newPassword = document.getElementById('new-password');
      const confirmPassword = document.getElementById('confirm-password');
      const statusMsg = document.getElementById('status-msg');

      // Check if we have the access token in the URL
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      // If no access token is found, show an error
      if (!accessToken || type !== 'recovery') {
        statusMsg.textContent = '❌ Invalid or expired password reset link. Please request a new one.';
        statusMsg.className = 'status-message error';
        form.style.display = 'none';
        return;
      }

      // Set the access token in Supabase
      supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Validate passwords
        if (newPassword.value.length < 8) {
          statusMsg.textContent = '❌ Password must be at least 8 characters long.';
          statusMsg.className = 'status-message error';
          return;
        }

        if (newPassword.value !== confirmPassword.value) {
          statusMsg.textContent = '❌ Passwords do not match.';
          statusMsg.className = 'status-message error';
          return;
        }

        statusMsg.textContent = '⏳ Updating password...';
        statusMsg.className = 'status-message';

        try {
          // Update the password
          const { error } = await supabase.auth.updateUser({
            password: newPassword.value
          });

          if (error) throw error;

          statusMsg.textContent = '✅ Password has been reset successfully!';
          statusMsg.className = 'status-message success';

          // Redirect to login page after 3 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000);
        } catch (error) {
          console.error('Password reset error:', error);
          statusMsg.textContent = '❌ ' + (error.message || 'Failed to reset password. Please try again.');
          statusMsg.className = 'status-message error';
        }
      });
    });

    // Mobile nav menu toggle
    document.querySelector('.hamburger').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('active');
    });
  </script>
</body>
</html>
